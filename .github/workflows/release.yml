name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-release.yml
