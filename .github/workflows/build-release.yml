name: Build Release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine release tag
        id: version
        shell: bash
        run: |
          latest="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          if [ -z "$latest" ]; then
            tag="v1.0.0"
          else
            ver="${latest#v}"
            IFS='.' read -r major minor patch <<< "$ver"
            tag="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build PDFMerger.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PDFMerger
          --collect-all customtkinter
          --collect-all pymupdf
          --collect-all tkinterdnd2
          main.py

      - name: Package release zip
        run: Compress-Archive -Path dist\PDFMerger.exe -DestinationPath PDFMerger-windows.zip -Force

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: PDFMerger-windows.zip
          generate_release_notes: true

      - name: Push release tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
